<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111319"/><stop offset="100%" stop-color="#0a0b0e"/></linearGradient><linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f2d37f"/><stop offset="100%" stop-color="#8d640f"/></linearGradient></defs><rect width="1600" height="980" fill="url(#bg)"/><text x="64" y="78" fill="#f5f1e6" font-family="Arial" font-size="40" font-weight="700">VOICE INTERACTION SCENARIO</text><text x="64" y="116" fill="#9ea3ad" font-family="Arial" font-size="18">How Cyrus sounds in a real-use situation</text><rect x="60" y="160" width="520" height="760" rx="30" fill="#0f1116" stroke="#2c3139"/><text x="92" y="206" fill="#9ea3ad" font-family="Arial" font-size="16">REALTIME / MOBILE VIEW</text><rect x="96" y="236" width="448" height="644" rx="34" fill="#141821" stroke="#363c46"/><circle cx="320" cy="372" r="110" fill="url(#orb)" opacity="0.95"/><circle cx="320" cy="372" r="142" fill="none" stroke="#c29a30" stroke-opacity="0.35" stroke-width="4"/><text x="320" y="540" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="22">SCANNING</text><rect x="146" y="602" width="348" height="72" rx="22" fill="#0f1116" stroke="#3b4250"/><text x="170" y="636" fill="#9ea3ad" font-family="Arial" font-size="14">SYSTEM</text><text x="170" y="662" fill="#f5f1e6" font-family="Arial" font-size="22">正在访问互联网。</text><rect x="146" y="692" width="348" height="72" rx="22" fill="#1b2217" stroke="#3f5f42"/><text x="170" y="726" fill="#9ea3ad" font-family="Arial" font-size="14">CYRUS</text><text x="170" y="752" fill="#f5f1e6" font-family="Arial" font-size="22">好的，先生。正在查看。</text><rect x="620" y="160" width="920" height="760" rx="30" fill="#111317" stroke="#2c3139"/><text x="656" y="206" fill="#9ea3ad" font-family="Arial" font-size="16">SCENE DEMO</text><text x="656" y="252" fill="#f5f1e6" font-family="Arial" font-size="34" font-weight="700">“Search this company and tell me whether it matters.”</text><rect x="656" y="304" width="840" height="120" rx="24" fill="#141821" stroke="#363c46"/><circle cx="704" cy="364" r="24" fill="#202735"/><text x="704" y="371" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="18">1</text><text x="744" y="348" fill="#9ea3ad" font-family="Arial" font-size="14">USER</text><text x="744" y="380" fill="#f5f1e6" font-family="Arial" font-size="24">先生：查一下这家公司值不值得关注。</text><rect x="656" y="448" width="840" height="138" rx="24" fill="#171d14" stroke="#43644f"/><circle cx="704" cy="516" r="24" fill="#202735"/><text x="704" y="523" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="18">2</text><text x="744" y="490" fill="#9ea3ad" font-family="Arial" font-size="14">CYRUS OPERATIONAL VOICE</text><text x="744" y="524" fill="#f5f1e6" font-family="Arial" font-size="24">好的，先生。</text><text x="744" y="558" fill="#f5f1e6" font-family="Arial" font-size="24">Accessing Internet.</text><rect x="656" y="612" width="840" height="132" rx="24" fill="#141821" stroke="#363c46"/><circle cx="704" cy="678" r="24" fill="#202735"/><text x="704" y="685" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="18">3</text><text x="744" y="652" fill="#9ea3ad" font-family="Arial" font-size="14">SYSTEM STATE</text><text x="744" y="686" fill="#f5f1e6" font-family="Arial" font-size="24">静默执行默认开启。</text><text x="744" y="718" fill="#9ea3ad" font-family="Arial" font-size="20">Only meaningful progress, blocker or result is spoken.</text><rect x="656" y="768" width="840" height="132" rx="24" fill="#141821" stroke="#363c46"/><circle cx="704" cy="834" r="24" fill="#202735"/><text x="704" y="841" text-anchor="middle" fill="#d4af37" font-family="Arial" font-size="18">4</text><text x="744" y="808" fill="#9ea3ad" font-family="Arial" font-size="14">RESULT</text><text x="744" y="842" fill="#f5f1e6" font-family="Arial" font-size="24">查到了，先生。这家公司对当前项目有中等相关性。