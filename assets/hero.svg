<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Cyrus Reality RPG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="60%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#17120a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a66a00"/>
      <stop offset="40%" stop-color="#f4c24f"/>
      <stop offset="70%" stop-color="#ffe6a1"/>
      <stop offset="100%" stop-color="#b67806"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="384" rx="22" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="352" rx="16" fill="none" stroke="#6d4a0d" stroke-width="1"/>
  <circle cx="1010" cy="208" r="104" fill="#0b0b0b" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="1010" cy="208" r="72" fill="none" stroke="#6d4a0d" stroke-width="2"/>
  <circle cx="1010" cy="208" r="38" fill="#d99a1e" opacity="0.22" filter="url(#glow)"/>
  <path d="M1010 98 L1031 175 L1110 208 L1031 241 L1010 318 L989 241 L910 208 L989 175 Z" fill="none" stroke="#f4c24f" stroke-width="2" opacity="0.85"/>
  <text x="82" y="120" fill="#f4c24f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">CYRUS / REALITY RPG</text>
  <text x="82" y="205" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">现实 RPG 系统</text>
  <text x="82" y="264" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="27">把任务、能力、资源、关系与成长，变成可观察、可计算、可推进的系统。</text>
  <line x1="82" y1="305" x2="760" y2="305" stroke="#70521b" stroke-width="1"/>
  <text x="82" y="344" fill="#bcbcbc" font-family="Arial, Helvetica, sans-serif" font-size="20">Game language is the interface. Reality remains the source.</text>
</svg>